server {
    listen 80;
    server_name _;

    # Maximum file upload size for PDF/document question imports
    client_max_body_size 30M;

    # Frontend compiled assets root
    root /home/ubuntu/QuizForge/frontend/dist;
    index index.html;

    # Gzip Compression for high performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Client-side routing fallback for React Router SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to local FastAPI backend on port 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
